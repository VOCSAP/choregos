name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  plugins:
    runs-on: ubuntu-latest
    outputs:
      names: ${{ steps.list.outputs.names }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: |
          manifest=.claude-plugin/marketplace.json
          invalid=$(jq -r '.plugins[].name | select(test("^[a-z0-9][a-z0-9-]{0,63}$") | not)' "$manifest")
          if [ -n "$invalid" ]; then
            echo "::error::plugin name must match ^[a-z0-9][a-z0-9-]{0,63}\$: $invalid"
            exit 1
          fi
          misplaced=$(jq -r '.plugins[] | select(.source != "./plugins/" + .name) | .name' "$manifest")
          if [ -n "$misplaced" ]; then
            echo "::error::source is not ./plugins/<name> for: $misplaced"
            exit 1
          fi
          declared=$(jq -c '[.plugins[].name] | sort' "$manifest")
          folders=$(find plugins -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | jq -Rsc 'split("\n") | map(select(. != "")) | sort')
          if [ "$declared" != "$folders" ]; then
            echo "::error::marketplace plugins $declared differ from plugins/ folders $folders"
            exit 1
          fi
          echo "names=$declared" >> "$GITHUB_OUTPUT"
      - name: versions.ts is identical in every plugin
        run: |
          reference=""
          for dir in plugins/*/; do
            file="${dir}hooks/versions.ts"
            if [ ! -f "$file" ]; then
              echo "::error::$file is missing"
              exit 1
            fi
            if [ -z "$reference" ]; then
              reference="$file"
            elif ! cmp -s "$reference" "$file"; then
              echo "::error::$file differs from $reference"
              exit 1
            fi
          done

  plugin:
    needs: plugins
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        plugin: ${{ fromJSON(needs.plugins.outputs.names) }}
    env:
      PLUGIN: ${{ matrix.plugin }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --global @anthropic-ai/claude-code@2.1.303
      - run: claude plugin validate "plugins/$PLUGIN"
      - run: claude plugin test "plugins/$PLUGIN"
